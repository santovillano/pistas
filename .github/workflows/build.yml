name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: kerf-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Kerf.apk
          gh release create "kerf-${{ github.run_number }}" Kerf.apk \
            --title "KERF (APK ${{ github.run_number }})" \
            --notes "APK de KERF, optimizador de cortes, para instalar en Android." \
            --latest=false
