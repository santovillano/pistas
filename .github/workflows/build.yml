name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: decorte-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Decorte.apk
          gh release create "decorte-${{ github.run_number }}" Decorte.apk \
            --title "Decorte (APK ${{ github.run_number }})" \
            --notes "APK de Decorte, optimizador de cortes, para instalar en Android." \
            --latest=false

      - name: Dejar el APK en una rama
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/out && cp Decorte.apk /tmp/out/ && cd /tmp/out
          git init -q -b decorte-apk
          git config user.email "actions@github.com"
          git config user.name "actions"
          git add Decorte.apk
          git commit -q -m "APK compilado"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" decorte-apk
